<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title">
  <title id="title">Entry paid-plan monthly starting points for AI email tools, 2026</title>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111">Entry paid-plan monthly starting point (USD)</text>
  <text x="360" y="52" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Source: vendor pricing pages, as of 2026-08-14. Omnisend publishes a fixed rate; Mailchimp and Klaviyo scale with contacts.</text>

  <!-- Axis -->
  <line x1="90" y1="360" x2="680" y2="360" stroke="#333" stroke-width="2"/>
  <text x="90" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Omnisend (Standard)</text>
  <text x="335" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Mailchimp (paid)</text>
  <text x="580" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Klaviyo (paid)</text>

  <!-- Y axis labels up to ~45 -->
  <text x="80" y="364" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#555">$0</text>
  <text x="80" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#555">$20</text>
  <text x="80" y="156" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#555">$40</text>
  <line x1="90" y1="360" x2="680" y2="360" stroke="#ddd" stroke-width="1"/>

  <!-- Omnisend bar ~$11.20 / scale: 2px per dollar, baseline y=360, so $11.20 = ~22.4px up -->
  <rect x="135" y="337.6" width="70" height="22.4" fill="#1f8a63"/>
  <text x="170" y="330" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">$11.20</text>
  <text x="170" y="314" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">per month (billed monthly)</text>

  <!-- Mailchimp: label varies, draw a representative range bar -->
  <rect x="300" y="150" width="70" height="210" fill="#d98a3d" opacity="0.55"/>
  <rect x="300" y="300" width="70" height="60" fill="#d98a3d"/>
  <text x="335" y="226" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111" transform="rotate(-90 335 226)">varies</text>
  <text x="335" y="292" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">scales with contacts</text>

  <!-- Klaviyo: label varies, range bar -->
  <rect x="545" y="150" width="70" height="210" fill="#7a5cc9" opacity="0.55"/>
  <rect x="545" y="300" width="70" height="60" fill="#7a5cc9"/>
  <text x="580" y="226" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111" transform="rotate(-90 580 226)">varies</text>
  <text x="580" y="292" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">scales with contacts + features</text>

  <!-- Footnote -->
  <text x="360" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#888">Omnisend: paid plans from $11.20/mo (billed monthly); Pro $41.30/mo. Free tiers: Omnisend 500 emails/mo, Mailchimp 500 emails/mo.</text>
</svg>
