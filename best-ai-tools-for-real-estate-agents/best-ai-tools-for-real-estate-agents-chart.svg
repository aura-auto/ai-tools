<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent AI workflow: capture, follow up, market, measure</title>
  <desc id="desc">Four stages of the agent workflow with the best-fitting AI tool named at each: capture leads (ChatGPT), follow up fast (Follow Up Boss), market the listing (Virtual Staging AI), and analyze what works (Semrush, Omnisend).</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Which AI tool fits each stage of the agent loop</text>

    <!-- Arrow flow between stages -->
    <path d="M300 78 L340 78" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M300 168 L340 168" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M300 258 L340 258" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
      </marker>
    </defs>

    <!-- Stage 1 -->
    <rect x="20" y="45" width="280" height="66" rx="8" fill="#eef4fb" stroke="#2a5aa8" stroke-width="2"/>
    <text x="160" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">1. Capture leads &amp; draft copy</text>
    <text x="160" y="90" text-anchor="middle" font-size="12" fill="#333">ChatGPT - $0 free tier</text>
    <text x="160" y="105" text-anchor="middle" font-size="11" fill="#555">draft listings, buyer replies</text>

    <!-- Stage 2 -->
    <rect x="340" y="45" width="280" height="66" rx="8" fill="#eaf6ef" stroke="#2e7d32" stroke-width="2"/>
    <text x="480" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">2. Follow up fast on every lead</text>
    <text x="480" y="90" text-anchor="middle" font-size="12" fill="#333">Follow Up Boss - from $58/user/mo</text>
    <text x="480" y="105" text-anchor="middle" font-size="11" fill="#555">AI lead prioritization, smart messages</text>

    <!-- Stage 3 -->
    <rect x="20" y="135" width="280" height="66" rx="8" fill="#fdf4e7" stroke="#b26a00" stroke-width="2"/>
    <text x="160" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">3. Market the listing</text>
    <text x="160" y="180" text-anchor="middle" font-size="12" fill="#333">Virtual Staging AI - from about $16/mo</text>
    <text x="160" y="195" text-anchor="middle" font-size="11" fill="#555">furnish empty-room photos, disclose</text>

    <!-- Stage 4 -->
    <rect x="340" y="135" width="280" height="66" rx="8" fill="#f4eefb" stroke="#6a1b9a" stroke-width="2"/>
    <text x="480" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">4. Analyze what works</text>
    <text x="480" y="180" text-anchor="middle" font-size="12" fill="#333">Semrush - AI search visibility</text>
    <text x="480" y="195" text-anchor="middle" font-size="11" fill="#555">omnisend - AI email/segment nurture</text>

    <!-- Bottom note -->
    <text x="320" y="250" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">Costs are the lowest verified entry price on each vendor's official pricing page,</text>
    <text x="320" y="267" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">retrieved August 2026. Semrush and Omnisend paid tiers are plan-based.</text>
    <text x="320" y="294" text-anchor="middle" font-size="11" fill="#666">Start: ChatGPT free + a CRM. Add staging, then analytics, only when follow-up is running.</text>
  </g>
</svg>
