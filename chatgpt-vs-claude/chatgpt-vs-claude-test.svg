<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Three-step diagram for testing ChatGPT and Claude free tiers before paying">
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="320" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">How to test both before paying</text>
  <rect x="30" y="70" width="180" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="120" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">1. Pick 3 tasks</text>
  <text x="120" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Your real weekly work:</text>
  <text x="120" y="138" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">drafting, coding, research,</text>
  <text x="120" y="152" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">analysis, writing</text>
  <line x1="210" y1="115" x2="230" y2="115" stroke="#999" stroke-width="2" marker-end="url(#a)"/>
  <rect x="230" y="70" width="180" height="90" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="320" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">2. Same prompts</text>
  <text x="320" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Run identical prompts on</text>
  <text x="320" y="138" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">ChatGPT Free and Claude Free</text>
  <line x1="410" y1="115" x2="430" y2="115" stroke="#999" stroke-width="2"/>
  <rect x="430" y="70" width="180" height="90" rx="10" fill="#fff3e0" stroke="#e65100"/>
  <text x="520" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#bf360c">3. Compare limits</text>
  <text x="520" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Watch usage caps and where</text>
  <text x="520" y="138" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">each falls short of your volume</text>
  <rect x="120" y="190" width="400" height="52" rx="10" fill="#f5f5f5" stroke="#999"/>
  <text x="320" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Then pay for one month of the $20 tier</text>
  <text x="320" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">before committing to annual billing</text>
</svg>
