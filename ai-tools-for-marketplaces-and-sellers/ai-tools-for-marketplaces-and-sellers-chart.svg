<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Entry-level paid plan cost per month for AI tools for marketplace sellers</title>
  <desc id="desc">Bar chart comparing the lowest paid tier of Omnisend ($11.20/mo Standard, $0 free), Jungle Scout Catalyst ($29/mo Starter), Jasper Pro ($59/mo), and Helium 10 ($99/mo Platinum).</desc>
  <rect width="640" height="400" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Lowest paid tier, cost per month (USD)</text>
    <text x="320" y="47" text-anchor="middle" font-size="11" fill="#555">From official pricing pages, retrieved August 14, 2026. Annual billing for Jungle Scout, Helium 10, and Jasper.</text>

    <!-- Chart area -->
    <!-- Axis -->
    <line x1="60" y1="60" x2="60" y2="330" stroke="#333" stroke-width="2"/>
    <line x1="60" y1="330" x2="580" y2="330" stroke="#333" stroke-width="2"/>

    <!-- Y gridlines and labels: 0, 25, 50, 75, 100 -->
    <!-- scale: $100 = 250px => 2.5px per dollar -->
    <g font-size="11" fill="#333">
      <text x="50" y="334" text-anchor="end">$0</text>
      <text x="50" y="271" text-anchor="end">$25</text>
      <text x="50" y="209" text-anchor="end">$50</text>
      <text x="50" y="147" text-anchor="end">$75</text>
      <text x="50" y="80" text-anchor="end">$100</text>
    </g>
    <g stroke="#ddd" stroke-width="1">
      <line x1="60" y1="330" x2="580" y2="330"/>
      <line x1="60" y1="267.5" x2="580" y2="267.5"/>
      <line x1="60" y1="205" x2="580" y2="205"/>
      <line x1="60" y1="142.5" x2="580" y2="142.5"/>
      <line x1="60" y1="80" x2="580" y2="80"/>
    </g>

    <!-- Bars: 4 bars, each 100 wide, gap 16 -->
    <!-- Omnisend Standard $11.20 -> 268px => y=62, height 28 -->
    <rect x="94" y="302" width="100" height="28" fill="#2a5aa8"/>
    <text x="144" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">$11.20</text>
    <text x="144" y="356" text-anchor="middle" font-size="12" fill="#1a1a2e">Omnisend (Std)</text>

    <!-- Jungle Scout $29 -> 72.5 => y=257.5 height 72.5 -->
    <rect x="210" y="257" width="100" height="73" fill="#2e7d32"/>
    <text x="260" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">$29</text>
    <text x="260" y="356" text-anchor="middle" font-size="12" fill="#1a1a2e">Jungle Scout</text>

    <!-- Jasper $59 -> 147.5 => y=182.5 height 147.5 -->
    <rect x="326" y="182" width="100" height="148" fill="#b26a00"/>
    <text x="376" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">$59</text>
    <text x="376" y="356" text-anchor="middle" font-size="12" fill="#1a1a2e">Jasper Pro</text>

    <!-- Helium 10 $99 -> 247 => y=83 height 247 -->
    <rect x="442" y="83" width="100" height="247" fill="#6a1b9a"/>
    <text x="492" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">$99</text>
    <text x="492" y="356" text-anchor="middle" font-size="12" fill="#1a1a2e">Helium 10</text>

    <text x="320" y="386" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">Omnisend also has a $0 free plan (500 emails/mo, 250 contacts) - the only tool here with a usable free tier.</text>
  </g>
</svg>
