<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Bar chart comparing context window size and output token pricing for Claude and ChatGPT coding models">
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Coding models compared (official docs, Aug 2026)</text>

  <text x="40" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Context window (tokens)</text>
  <rect x="40" y="85" width="200" height="22" rx="4" fill="#1565c0"/>
  <text x="250" y="101" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">GPT-5.6 Sol: 1,050,000</text>
  <rect x="40" y="115" width="190" height="22" rx="4" fill="#2e7d32"/>
  <text x="240" y="131" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">Claude Opus 5: 1,000,000</text>
  <rect x="40" y="145" width="190" height="22" rx="4" fill="#2e7d32"/>
  <text x="240" y="161" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">Claude Sonnet 5: 1,000,000</text>
  <rect x="40" y="175" width="38" height="22" rx="4" fill="#7cb342"/>
  <text x="88" y="191" font-family="Arial, sans-serif" font-size="12" fill="#7cb342">Claude Haiku 4.5: 200,000</text>

  <line x1="40" y1="215" x2="600" y2="215" stroke="#ccc" stroke-width="1"/>

  <text x="40" y="242" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Output token price (USD per 1M tokens)</text>
  <rect x="40" y="256" width="150" height="22" rx="4" fill="#e65100"/>
  <text x="200" y="272" font-family="Arial, sans-serif" font-size="12" fill="#e65100">GPT-5.6 Sol: $30</text>
  <rect x="40" y="286" width="125" height="22" rx="4" fill="#1565c0"/>
  <text x="175" y="302" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">Claude Opus 5: $25</text>
  <rect x="40" y="316" width="50" height="22" rx="4" fill="#2e7d32"/>
  <text x="100" y="332" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">Claude Sonnet 5: $10</text>

  <rect x="40" y="340" width="560" height="1" fill="#eee"/>
  <text x="320" y="356" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#888">Bar widths are approximate; labels carry the exact verified values</text>
</svg>
