<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="480" fill="#f8fafc" rx="8"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">AI Image Generators 2026: Price vs Quality</text>
  <text x="400" y="54" text-anchor="middle" font-size="11" fill="#64748b">Starting monthly price (or per-image cost) vs. quality tier. Data verified August 2026.</text>

  <!-- Y-axis labels -->
  <text x="90" y="95" text-anchor="end" font-size="11" fill="#475569">Premium</text>
  <text x="90" y="185" text-anchor="end" font-size="11" fill="#475569">High</text>
  <text x="90" y="275" text-anchor="end" font-size="11" fill="#475569">Mid</text>
  <text x="90" y="365" text-anchor="end" font-size="11" fill="#475569">Basic</text>

  <!-- Grid lines -->
  <line x1="100" y1="90" x2="760" y2="90" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="100" y1="180" x2="760" y2="180" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="100" y1="270" x2="760" y2="270" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="100" y1="360" x2="760" y2="360" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bars - height represents price (higher bar = higher price), vertical position = quality -->
  <!-- Midjourney V7 - $10/mo, Premium quality -->
  <rect x="120" y="90" width="80" height="120" fill="#6366f1" rx="4" opacity="0.9"/>
  <text x="160" y="145" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Midjourney</text>
  <text x="160" y="160" text-anchor="middle" font-size="10" fill="white">$10/mo</text>
  <text x="160" y="225" text-anchor="middle" font-size="10" fill="#6366f1" font-weight="bold">Premium</text>

  <!-- GPT Image 1.5 - $20/mo, Premium quality -->
  <rect x="220" y="90" width="80" height="180" fill="#8b5cf6" rx="4" opacity="0.9"/>
  <text x="260" y="170" text-anchor="middle" font-size="11" fill="white" font-weight="bold">GPT Image</text>
  <text x="260" y="185" text-anchor="middle" font-size="10" fill="white">$20/mo</text>
  <text x="260" y="225" text-anchor="middle" font-size="10" fill="#8b5cf6" font-weight="bold">Premium</text>

  <!-- FLUX.2 - $0.01-0.10/image, Premium quality -->
  <rect x="320" y="90" width="80" height="30" fill="#10b981" rx="4" opacity="0.9"/>
  <text x="360" y="110" text-anchor="middle" font-size="11" fill="white" font-weight="bold">FLUX.2</text>
  <text x="360" y="225" text-anchor="middle" font-size="10" fill="#10b981" font-weight="bold">Premium</text>
  <text x="360" y="140" text-anchor="middle" font-size="9" fill="#64748b">$0.01-0.10/img</text>

  <!-- Adobe Firefly - $9.29/mo, High quality -->
  <rect x="420" y="180" width="80" height="110" fill="#f59e0b" rx="4" opacity="0.9"/>
  <text x="460" y="230" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Firefly</text>
  <text x="460" y="245" text-anchor="middle" font-size="10" fill="white">$9.29/mo</text>
  <text x="460" y="305" text-anchor="middle" font-size="10" fill="#f59e0b" font-weight="bold">High</text>

  <!-- Google Gemini - Free, Mid quality -->
  <rect x="520" y="270" width="80" height="15" fill="#06b6d4" rx="4" opacity="0.9"/>
  <text x="560" y="288" text-anchor="middle" font-size="10" fill="#06b6d4" font-weight="bold">Gemini</text>
  <text x="560" y="305" text-anchor="middle" font-size="9" fill="#64748b">Free (20/day)</text>
  <text x="560" y="315" text-anchor="middle" font-size="10" fill="#06b6d4" font-weight="bold">Mid-High</text>

  <!-- Stable Diffusion 3.5 - Free, Mid quality -->
  <rect x="620" y="270" width="80" height="15" fill="#334155" rx="4" opacity="0.9"/>
  <text x="660" y="288" text-anchor="middle" font-size="10" fill="#334155" font-weight="bold">SD 3.5</text>
  <text x="660" y="305" text-anchor="middle" font-size="9" fill="#64748b">Free (local)</text>
  <text x="660" y="315" text-anchor="middle" font-size="10" fill="#334155" font-weight="bold">Mid</text>

  <!-- Ideogram 3.0 - $7/mo, Mid-High quality -->
  <rect x="720" y="180" width="50" height="90" fill="#ec4899" rx="4" opacity="0.9"/>
  <text x="745" y="220" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Ideo</text>
  <text x="745" y="235" text-anchor="middle" font-size="9" fill="white">$7/mo</text>
  <text x="745" y="305" text-anchor="middle" font-size="9" fill="#ec4899" font-weight="bold">Mid-High</text>

  <!-- Legend -->
  <rect x="120" y="420" width="12" height="12" fill="#6366f1" rx="2"/>
  <text x="138" y="431" font-size="10" fill="#475569">Subscription-based</text>
  <rect x="280" y="420" width="12" height="12" fill="#10b981" rx="2"/>
  <text x="298" y="431" font-size="10" fill="#475569">Pay-per-image</text>
  <rect x="430" y="420" width="12" height="12" fill="#06b6d4" rx="2"/>
  <text x="448" y="431" font-size="10" fill="#475569">Free tier</text>
  <rect x="550" y="420" width="12" height="12" fill="#334155" rx="2"/>
  <text x="568" y="431" font-size="10" fill="#475569">Open source</text>
</svg>