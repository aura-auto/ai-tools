<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-label="Bar chart of verified August 2026 monthly prices for Obsidian Sync and Google AI plans">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="320" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Verified monthly prices, August 2026 (official pages)</text>
  <!-- scale: 4px per dollar, cap 20 -> 80px above baseline 250 -->
  <!-- Obsidian bars (x=120..250) -->
  <text x="185" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Obsidian Sync</text>
  <rect x="120" y="250-16" width="40" height="16" fill="#5a4fcf"/>
  <rect x="120" y="234" width="40" height="16" fill="#5a4fcf"/>
  <rect x="170" y="250-32" width="40" height="32" fill="#5a4fcf"/>
  <rect x="170" y="218" width="40" height="32" fill="#5a4fcf"/>
  <text x="140" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Standard $4</text>
  <text x="190" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Plus $8</text>
  <!-- Google AI bars (x=360..520) -->
  <text x="440" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Google AI (Gemini)</text>
  <rect x="380" y="250-39.96" width="46" height="39.96" fill="#4285f4"/>
  <rect x="380" y="210" width="46" height="40" fill="#4285f4"/>
  <rect x="460" y="250-79.96" width="46" height="79.96" fill="#4285f4"/>
  <rect x="460" y="170" width="46" height="80" fill="#4285f4"/>
  <text x="403" y="268" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">AI Plus $9.99</text>
  <text x="483" y="268" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">AI Pro $19.99</text>
  <!-- baseline -->
  <line x1="80" y1="250" x2="580" y2="250" stroke="#999" stroke-width="1"/>
  <text x="320" y="295" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Notion, Evernote, and Microsoft Copilot depend on specific plans, so they are not shown.</text>
  <text x="320" y="315" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Obsidian core app is free; Sync is an optional add-on. Google AI plans raise Gemini Notebook limits.</text>
</svg>
